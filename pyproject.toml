[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutmarker"
version = "1.0.0"
description = "Automatic film cut detection and Pro Tools marker generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CutMarker" }]
dependencies = [
  "PySide6>=6.6.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.8.0",
  "scenedetect>=0.6.4",
  "opencv-python>=4.8.0",
  "imageio-ffmpeg>=0.5.1",
  "Pillow>=10.0.0",
  "py-ptsl>=600.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyinstaller>=6.0.0"]

[project.scripts]
cutmarker = "cutmarker.__main__:main"

[tool.setuptools.packages.find]
include = ["cutmarker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
